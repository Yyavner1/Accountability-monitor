name: Build release apps

# Builds the self-contained app for macOS, Windows, and Linux whenever you
# publish a release (or push a version tag), and attaches the downloads to
# that release. This runs on GitHub's machines — one per operating system —
# because each OS can only build its own app.

on:
  release:
    types: [created]
  push:
    tags: ["v*"]
  workflow_dispatch:   # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: accountability-monitor-macos
          - os: windows-latest
            asset: accountability-monitor-windows
          - os: ubuntu-latest
            asset: accountability-monitor-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build
        run: pyinstaller packaging/accountability-monitor.spec

      - name: Package (zip the dist output)
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../${{ matrix.asset }}.zip" accountability-monitor*
          else
            zip -r "../${{ matrix.asset }}.zip" accountability-monitor*
          fi

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.zip

      - name: Attach to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}.zip
