{% extends "base.html" %}
{% block title %}Subscribe · Accountability Monitor{% endblock %}
{% block content %}
<header>
  <h1>Accountability Monitor</h1>
  <div class="mut"><a href="/settings">Settings</a> · <a href="/logout">Sign out</a></div>
</header>
<div class="card" style="margin-top:24px">
  <h2>A subscription is required</h2>
  <p class="mut">Subscribe to activate monitoring and the dashboard.</p>
  <form method="post" action="/billing/checkout" style="margin-top:12px">
    <button type="submit">Subscribe</button>
  </form>
</div>
{% endblock %}
